<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soul Творчество — Как это работает?</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 50%, #06B6D4 100%);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatCreative 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 20px; height: 20px; background: rgba(255, 255, 255, 0.25); top: 5%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 15px; height: 15px; background: rgba(255, 182, 193, 0.3); top: 15%; left: 85%; animation-delay: 0.5s; }
        .particle:nth-child(3) { width: 25px; height: 25px; background: rgba(255, 255, 255, 0.2); top: 25%; left: 20%; animation-delay: 1s; }
        .particle:nth-child(4) { width: 12px; height: 12px; background: rgba(147, 197, 253, 0.35); top: 35%; left: 75%; animation-delay: 1.5s; }
        .particle:nth-child(5) { width: 18px; height: 18px; background: rgba(255, 255, 255, 0.25); top: 45%; left: 30%; animation-delay: 2s; }
        .particle:nth-child(6) { width: 22px; height: 22px; background: rgba(196, 181, 253, 0.3); top: 55%; left: 80%; animation-delay: 2.5s; }
        .particle:nth-child(7) { width: 14px; height: 14px; background: rgba(255, 255, 255, 0.2); top: 65%; left: 15%; animation-delay: 3s; }
        .particle:nth-child(8) { width: 20px; height: 20px; background: rgba(165, 243, 252, 0.3); top: 75%; left: 60%; animation-delay: 3.5s; }
        .particle:nth-child(9) { width: 16px; height: 16px; background: rgba(255, 255, 255, 0.25); top: 85%; left: 40%; animation-delay: 4s; }
        .particle:nth-child(10) { width: 19px; height: 19px; background: rgba(251, 207, 232, 0.3); top: 92%; left: 70%; animation-delay: 4.5s; }

        @keyframes floatCreative {
            0% {
                transform: translateY(0px) translateX(0px) rotate(0deg) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-30px) translateX(20px) rotate(90deg) scale(1.2);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-15px) translateX(-15px) rotate(180deg) scale(0.9);
                opacity: 0.4;
            }
            75% {
                transform: translateY(-40px) translateX(10px) rotate(270deg) scale(1.1);
                opacity: 0.5;
            }
            100% {
                transform: translateY(0px) translateX(0px) rotate(360deg) scale(1);
                opacity: 0.3;
            }
        }

        .hero {
            text-align: center;
            padding: 25px 0 30px;
            animation: fadeInUp 0.7s ease-out forwards;
        }

        .hero-icon {
            font-size: 80px;
            display: inline-block;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { 
                transform: scale(1) rotate(0deg);
                filter: brightness(1) drop-shadow(0 0 0px transparent);
            }
            25% { 
                transform: scale(1.1) rotate(-8deg);
                filter: brightness(1.2) drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
            }
            50% { 
                transform: scale(1.15) rotate(0deg);
                filter: brightness(1.3) drop-shadow(0 0 25px rgba(255, 255, 255, 0.7));
            }
            75% { 
                transform: scale(1.1) rotate(8deg);
                filter: brightness(1.2) drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
            }
        }

        .hero-title {
            font-size: 32px;
            font-weight: 900;
            color: #FFFFFF;
            margin: 15px 0 10px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .hero-subtitle {
            font-size: 20px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
        }

        .hero-desc {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tabs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
            animation: fadeInUp 0.7s ease-out 0.2s forwards;
            opacity: 0;
        }

        .tab {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .tab:active {
            transform: scale(0.95);
        }

        .tab.active {
            background: linear-gradient(135deg, #EC4899, #8B5CF6);
            color: white;
            box-shadow: 0 6px 30px rgba(236, 72, 153, 0.5);
            animation: glowRainbow 2s ease-in-out infinite;
        }

        @keyframes glowRainbow {
            0%, 100% { box-shadow: 0 6px 25px rgba(236, 72, 153, 0.5); }
            33% { box-shadow: 0 6px 30px rgba(139, 92, 246, 0.5); }
            66% { box-shadow: 0 6px 30px rgba(6, 182, 212, 0.5); }
        }

        .tab-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
        }

        .tab-text {
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }

        .tab.active .tab-text {
            color: white;
        }

        .content-area {
            animation: fadeInUp 0.7s ease-out 0.4s forwards;
            opacity: 0;
            margin-bottom: 20px;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.4s ease-out;
        }

        .content-title {
            font-size: 19px;
            font-weight: 800;
            color: #333;
            margin-bottom: 15px;
        }

        .content-text {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
        }

        .content-text strong {
            color: #DB2777;
            font-weight: 700;
        }

        .content-text p {
            margin-bottom: 5px;
        }

        .content-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .content-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 15px;
            color: #444;
        }

        .content-list li:last-child {
            border-bottom: none;
        }

        .content-list li strong {
            color: #DB2777;
        }

        .cta-button {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: linear-gradient(135deg, #EC4899, #8B5CF6, #06B6D4, #EC4899);
            background-size: 300% 300%;
            color: white;
            font-size: 18px;
            font-weight: 800;
            padding: 18px 30px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(236, 72, 153, 0.4);
            animation: gradientMagic 3s ease infinite, fadeInUp 0.7s ease-out 0.6s forwards;
            z-index: 100;
            opacity: 0;
        }

        @keyframes gradientMagic {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 350px) {
            .hero-title { font-size: 26px; }
            .hero-icon { font-size: 64px; }
            .hero-subtitle { font-size: 17px; }
            .tab { padding: 16px 10px; }
            .tab-icon { font-size: 26px; }
            .tab-text { font-size: 13px; }
            .content-card { padding: 18px; }
            .content-title { font-size: 17px; }
        }
            /* Все внутренние элементы кнопок не блокируют клики */
        button *, .btn-back *, .btn-apply *, .btn-start *, .choice-btn *, .card *, .option * { pointer-events: none; }
    </style>
</head>

        <div class="particle"></div>

        <div class="particle"></div>

        const contentArea = document.querySelector('.content-area');

        function renderTab(tabKey) {
            contentArea.innerHTML = `
                <div class="content-card">
                    ${tabContent[tabKey]}
                </div>
            `;
        }

        renderTab('functions');

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

                renderTab(this.dataset.tab);
