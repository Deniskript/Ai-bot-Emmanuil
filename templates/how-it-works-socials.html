<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soul Соцсети — Как это работает?</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 50%, #0EA5E9 100%);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            animation: floatSocial 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 18px; height: 18px; top: 5%; left: 8%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 14px; height: 14px; top: 12%; left: 82%; animation-delay: 0.7s; }
        .particle:nth-child(3) { width: 22px; height: 22px; top: 24%; left: 18%; animation-delay: 1.4s; }
        .particle:nth-child(4) { width: 12px; height: 12px; top: 35%; left: 75%; animation-delay: 2.1s; }
        .particle:nth-child(5) { width: 20px; height: 20px; top: 48%; left: 28%; animation-delay: 2.8s; }
        .particle:nth-child(6) { width: 16px; height: 16px; top: 58%; left: 85%; animation-delay: 3.5s; }
        .particle:nth-child(7) { width: 24px; height: 24px; top: 70%; left: 42%; animation-delay: 4.2s; }
        .particle:nth-child(8) { width: 13px; height: 13px; top: 82%; left: 12%; animation-delay: 4.9s; }
        .particle:nth-child(9) { width: 17px; height: 17px; top: 92%; left: 68%; animation-delay: 5.6s; }

        @keyframes floatSocial {
            0% {
                transform: translateY(0px) translateX(0px) scale(1);
                opacity: 0.2;
            }
            20% {
                transform: translateY(-15px) translateX(8px) scale(1.2);
                opacity: 0.5;
            }
            40% {
                transform: translateY(-30px) translateX(-5px) scale(1.1);
                opacity: 0.4;
            }
            60% {
                transform: translateY(-45px) translateX(10px) scale(1.15);
                opacity: 0.55;
            }
            80% {
                transform: translateY(-25px) translateX(-8px) scale(1.05);
                opacity: 0.35;
            }
            100% {
                transform: translateY(0px) translateX(0px) scale(1);
                opacity: 0.2;
            }
        }

        .hero {
            text-align: center;
            padding: 25px 0 30px;
            animation: fadeInUp 0.7s ease-out forwards;
        }

        .hero-icon {
            font-size: 80px;
            display: inline-block;
            animation: ping 2s ease-in-out infinite;
        }

        @keyframes ping {
            0%, 100% { 
                transform: scale(1);
                filter: drop-shadow(0 0 0px transparent);
            }
            15% { 
                transform: scale(1.15);
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
            }
            30% { 
                transform: scale(1);
                filter: drop-shadow(0 0 0px transparent);
            }
            45% { 
                transform: scale(1.1);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
            }
            60% { 
                transform: scale(1);
            }
        }

        .hero-title {
            font-size: 32px;
            font-weight: 900;
            color: #FFFFFF;
            margin: 15px 0 10px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
        }

        .hero-subtitle {
            font-size: 20px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
        }

        .hero-desc {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tabs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
            animation: fadeInUp 0.7s ease-out 0.2s forwards;
            opacity: 0;
        }

        .tab {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .tab:active {
            transform: scale(0.95);
        }

        .tab.active {
            background: linear-gradient(135deg, #3B82F6, #0EA5E9);
            color: white;
            box-shadow: 0 6px 30px rgba(59, 130, 246, 0.5);
            animation: glowBlue 2s ease-in-out infinite;
        }

        @keyframes glowBlue {
            0%, 100% { box-shadow: 0 6px 25px rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 6px 40px rgba(14, 165, 233, 0.6); }
        }

        .tab-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
        }

        .tab-text {
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }

        .tab.active .tab-text {
            color: white;
        }

        .content-area {
            animation: fadeInUp 0.7s ease-out 0.4s forwards;
            opacity: 0;
            margin-bottom: 20px;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.4s ease-out;
        }

        .content-title {
            font-size: 19px;
            font-weight: 800;
            color: #333;
            margin-bottom: 15px;
        }

        .content-text {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
        }

        .content-text strong {
            color: #2563EB;
            font-weight: 700;
        }

        .content-text p {
            margin-bottom: 5px;
        }

        .content-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .content-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 15px;
            color: #444;
        }

        .content-list li:last-child {
            border-bottom: none;
        }

        .content-list li strong {
            color: #2563EB;
        }

        .cta-button {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: linear-gradient(135deg, #3B82F6, #60A5FA, #0EA5E9, #3B82F6);
            background-size: 300% 300%;
            color: white;
            font-size: 18px;
            font-weight: 800;
            padding: 18px 30px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.45);
            animation: gradientWave 3.5s ease infinite, fadeInUp 0.7s ease-out 0.6s forwards;
            z-index: 100;
            opacity: 0;
        }

        @keyframes gradientWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 350px) {
            .hero-title { font-size: 26px; }
            .hero-icon { font-size: 64px; }
            .hero-subtitle { font-size: 17px; }
            .tab { padding: 16px 10px; }
            .tab-icon { font-size: 26px; }
            .tab-text { font-size: 13px; }
            .content-card { padding: 18px; }
            .content-title { font-size: 17px; }
        }
            /* Все внутренние элементы кнопок не блокируют клики */
        button *, .btn-back *, .btn-apply *, .btn-start *, .choice-btn *, .card *, .option * { pointer-events: none; }
    </style>
</head>
<body>

        <div class="particle"></div>

        <div class="particle"></div>

        document.querySelectorAll('.tab').forEach(tab => {
