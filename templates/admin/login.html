<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Soul AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            max-width: 380px;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: 900; margin-bottom: 12px; }
        .message { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 20px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">👑</div>
        <h1 class="title">Soul AI Admin</h1>
        <p class="message">Авторизация через Telegram...</p>
        <div class="spinner"></div>
        <p class="message" style="font-size: 13px; color: #888;">
            Откройте админ-панель через команду /admin в боте
        </p>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // If we have initData, redirect to dashboard
        if (tg.initData) {
            window.location.href = '/admin/?initData=' + encodeURIComponent(tg.initData);
        } else {
            // Show error - must be opened from Telegram
            document.querySelector('.message').textContent = 'Откройте админ-панель через команду /admin в боте @soul_ai_bot';
            document.querySelector('.spinner').style.display = 'none';
        }
    </script>
</body>
</html>
