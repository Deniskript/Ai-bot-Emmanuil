<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Психолог Silas — Как это работает?</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7B68A6;
            --primary-light: #9D8EC4;
            --primary-dark: #5D4E8C;
            --gradient: linear-gradient(135deg, #7B68A6 0%, #9D8EC4 50%, #6B5B95 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #7B68A6 0%, #9D8EC4 100%);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            animation: floatSlow 8s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 25px; height: 25px; top: 5%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 18px; height: 18px; top: 15%; left: 80%; animation-delay: 1s; }
        .particle:nth-child(3) { width: 30px; height: 30px; top: 35%; left: 20%; animation-delay: 2s; }
        .particle:nth-child(4) { width: 15px; height: 15px; top: 50%; left: 70%; animation-delay: 3s; }
        .particle:nth-child(5) { width: 22px; height: 22px; top: 65%; left: 30%; animation-delay: 4s; }
        .particle:nth-child(6) { width: 12px; height: 12px; top: 80%; left: 85%; animation-delay: 5s; }
        .particle:nth-child(7) { width: 20px; height: 20px; top: 90%; left: 50%; animation-delay: 6s; }

        @keyframes floatSlow {
            0% { transform: translateY(0px) translateX(0px) scale(1); opacity: 0.2; }
            25% { transform: translateY(-20px) translateX(10px) scale(1.1); opacity: 0.4; }
            50% { transform: translateY(-35px) translateX(-5px) scale(1); opacity: 0.3; }
            75% { transform: translateY(-15px) translateX(-10px) scale(1.05); opacity: 0.4; }
            100% { transform: translateY(0px) translateX(0px) scale(1); opacity: 0.2; }
        }

        .container {
            max-width: 100%;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .hero {
            text-align: center;
            padding: 25px 0 30px;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .hero-icon {
            font-size: 80px;
            display: inline-block;
            animation: breathe 4s ease-in-out infinite;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 900;
            color: #FFFFFF;
            margin: 15px 0 10px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.15);
        }

        .hero-subtitle {
            font-size: 20px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
        }

        .hero-desc {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 8px;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            25% { transform: scale(1.08); }
            50% { transform: scale(1.12); }
            75% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .tabs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0;
        }

        .tab {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .tab:active {
            transform: scale(0.95);
        }

        .tab.active {
            background: #7B68A6;
            color: white;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0% { box-shadow: 0 6px 25px rgba(123, 104, 166, 0.3); }
            50% { box-shadow: 0 6px 35px rgba(123, 104, 166, 0.5); }
            100% { box-shadow: 0 6px 25px rgba(123, 104, 166, 0.3); }
        }

        .tab-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
        }

        .tab-text {
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }

        .tab.active .tab-text {
            color: white;
        }

        .content-area {
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
            opacity: 0;
            margin-bottom: 20px;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.4s ease-out;
        }

        .content-title {
            font-size: 19px;
            font-weight: 800;
            color: #333;
            margin-bottom: 15px;
        }

        .content-text {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
        }

        .content-text strong {
            color: #7B68A6;
            font-weight: 700;
        }

        .content-text p {
            margin-bottom: 5px;
        }

        .content-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .content-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 15px;
            color: #444;
        }

        .content-list li:last-child {
            border-bottom: none;
        }

        .content-list li strong {
            color: #7B68A6;
        }

        .cta-button {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: linear-gradient(135deg, #7B68A6, #9D8EC4, #6B5B95, #7B68A6);
            background-size: 300% 300%;
            color: white;
            font-size: 18px;
            font-weight: 800;
            padding: 18px 30px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(123, 104, 166, 0.4);
            animation: gradientFlow 4s ease infinite, fadeInUp 0.8s ease-out 0.6s forwards;
            z-index: 100;
            opacity: 0;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 350px) {
            .hero-title { font-size: 26px; }
            .hero-icon { font-size: 64px; }
            .hero-subtitle { font-size: 17px; }
            .tab { padding: 16px 10px; }
            .tab-icon { font-size: 26px; }
            .tab-text { font-size: 13px; }
        }
    </style>
</head>

        const contentArea = document.querySelector('.content-area');

        function renderTab(tabKey) {
            contentArea.innerHTML = `
                <div class="content-card">

            `;
        }

        renderTab('functions');

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderTab(this.dataset.tab);
            });
