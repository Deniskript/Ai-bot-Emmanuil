<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Bot - Личный кабинет</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeIn 0.5s;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.5s;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 16px 0;
        }

        .balance-label {
            font-size: 14px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subscription-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 12px;
            margin-top: 12px;
        }

        .subscription-type {
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
        }

        .subscription-expires {
            font-size: 14px;
            color: #6c757d;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }

        .stat-item {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 16px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 18px;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .badge {
            padding: 6px 12px;
            background: #667eea20;
            color: #667eea;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .stars-package {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .stars-package:hover {
            border-color: #667eea;
            transform: scale(1.02);
        }

        .stars-package.popular {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-color: #667eea;
        }

        .package-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .package-stars {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .package-price {
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
            margin-top: 4px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }
        .stars-package {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            cursor: pointer;
            text-align: center;
        }
        .stars-package:hover {
            border-color: #667eea;
        }
        .stars-package.popular {
            border-color: #667eea;
            background: #f0f0ff;
        }
        .package-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .package-stars {
            font-size: 24px;
            font-weight: 700;
        }
        .package-price {
            font-size: 20px;
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🙏 Soul Bot</h1>
            <p>Личный кабинет</p>
        </div>

        <div id="loading" class="loading">
            ⏳ Загрузка...
        </div>

        <div id="content" style="display: none;">
            <!-- Баланс -->
            <div class="card">
                <div class="card-title">💰 Баланс звёзд</div>
                <div class="balance-amount" id="balance">0</div>
                <div class="balance-label">Доступно звёзд</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress" style="width: 0%"></div>
                </div>
            </div>

            <!-- Подписка -->
            <div class="card">
                <div class="card-title">⭐ Подписка</div>
                <div class="subscription-info">
                    <div>
                        <div class="subscription-type" id="subType">Не активна</div>
                        <div class="subscription-expires" id="subExpires"></div>
                    </div>
                    <div style="font-size: 48px;" id="subEmoji">🎁</div>
                </div>
                <button class="btn" onclick="openSubscription()">⭐ Управление подпиской</button>
            </div>

            <!-- Статистика -->
            <div class="card">
                <div class="card-title">📊 Статистика</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="totalRequests">0</div>
                        <div class="stat-label">Запросов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalUsed">0</div>
                        <div class="stat-label">Использовано</div>
                    </div>
                </div>
                <div class="badges" id="badges"></div>
            </div>

            <!-- Реферальная программа -->
            <div class="card">
                <div class="card-title">👥 Реферальная программа</div>
                <p style="color: #555; margin-bottom: 16px;">Приглашай друзей — получай звёзды!</p>
                <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 12px;">
                    <div style="margin-bottom: 8px;">🌟 Друг оплатил Mini → <strong>+1,000 ⭐</strong></div>
                    <div>⭐ Друг оплатил Standard → <strong>+2,000 ⭐</strong></div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <input id="refLink" readonly value="https://t.me/iisoul_bot?start=ref_USERID" 
                           style="flex: 1; padding: 12px; border: 2px solid #e9ecef; border-radius: 8px; font-size: 14px;">
                    <button onclick="copyRefLink()" style="padding: 12px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                        📋 Копировать
                    </button>
                </div>
            </div>

            <!-- Действия -->
            <div class="card">
                <div class="card-title">⚡️ Быстрые действия</div>
                <button class="btn btn-secondary" onclick="Telegram.WebApp.close()">
                    ← Вернуться в бот
                </button>
            </div>
        </div>

        <div id="error" style="display: none;" class="error"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        window.tg = tg; // Делаем tg доступным глобально
        tg.ready();
        tg.expand();
        
        console.log("=== TELEGRAM DEBUG ===");
        console.log("initData string:", tg.initData);
        console.log("initDataUnsafe:", tg.initDataUnsafe);
        console.log("platform:", tg.platform);
        console.log("version:", tg.version);
        
        // Метод 1: из initDataUnsafe
        let userId = tg.initDataUnsafe?.user?.id;
        console.log("Method 1 - initDataUnsafe.user.id:", userId);
        
        // Метод 2: парсинг из initData строки
        if (!userId && tg.initData) {
            try {
                const params = new URLSearchParams(tg.initData);
                const userStr = params.get('user');
                if (userStr) {
                    const user = JSON.parse(userStr);
                    userId = user.id;
                    console.log("Method 2 - parsed from initData:", userId);
                }
            } catch (e) {
                console.error("Parse error:", e);
            }
        }
        
        // Метод 3: из URL параметра (для тестирования)
        if (!userId) {
            const urlParams = new URLSearchParams(window.location.search);
            userId = urlParams.get('user_id');
            console.log("Method 3 - from URL:", userId);
        }
        
        console.log("=== FINAL USER ID:", userId, "===");

        async function loadUserData() {
            if (!userId) {
                showError('❌ Не удалось получить ID пользователя\n\nОткройте через кнопку в боте!');
                return;
            }

            try {
                const response = await fetch(`/api/user/${userId}`);
                
                if (!response.ok) {
                    throw new Error('Ошибка загрузки данных');
                }

                const data = await response.json();
                console.log('User data:', data);
                
                // Показываем данные
                displayUserData(data);
                
                // Скрываем загрузку, показываем контент
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
            } catch (error) {
                console.error('Error:', error);
                showError('❌ Ошибка загрузки: ' + error.message);
            }
        }

        function displayUserData(data) {
            // Баланс
            const balance = data.stars || 0;
            document.getElementById('balance').textContent = formatNumber(balance);
            
            // Прогресс (пример: из 10K звёзд)
            const progress = Math.min((balance / 1000000) * 100, 100);
            document.getElementById('progress').style.width = progress + '%';

            // Подписка
            if (data.subscription && data.subscription.is_active) {
                const sub = data.subscription;
                document.getElementById('subType').textContent = sub.type === 'mini' ? '🌟 Mini' : '⭐ Standard';
                document.getElementById('subExpires').textContent = sub.expires_at ? 
                    'До ' + formatDate(sub.expires_at) : 'Активна';
                document.getElementById('subEmoji').textContent = sub.type === 'standard' ? '👑' : '🌟';
            } else {
                document.getElementById('subType').textContent = 'Не активна';
                document.getElementById('subExpires').textContent = 'Используете бонусные звёзды';
                document.getElementById('subEmoji').textContent = '🎁';
            }

            // Статистика
            document.getElementById('totalRequests').textContent = formatNumber(data.total_requests || 0);
            document.getElementById('totalUsed').textContent = formatNumber(data.total_used || 0) + ' tk';

            // Бейджи
            const badges = document.getElementById('badges');
            badges.innerHTML = '';
            
            if (data.total_requests > 100) {
                badges.innerHTML += '<div class="badge">🔥 Активный</div>';
            }
            if (data.total_requests > 500) {
                badges.innerHTML += '<div class="badge">⭐️ Эксперт</div>';
            }
            if (data.subscription && data.subscription.is_active) {
                badges.innerHTML += '<div class="badge">⭐ Подписчик</div>';
            }
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric' 
            });
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = message;
        }

        window.openSubscription = function() {
            console.log('openSubscription called!');
            // Показываем выбор: подписка или звёзды
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.id = 'subscriptionModal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 style="text-align: center; margin-bottom: 20px;">⭐ Управление подпиской</h3>
                    <button class="btn" onclick="window.selectSubscription()">
                        ⭐ Оформить подписку
                    </button>
                    <button class="btn btn-secondary" onclick="window.buyStars()">
                        💰 Докуп звёзд
                    </button>
                    <button class="btn btn-secondary" onclick="window.closeModal()" style="margin-top: 8px;">
                        ← Отмена
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.closeModal = function() {
            console.log('closeModal called!');
            const modal = document.getElementById('subscriptionModal');
            if (modal) {
                modal.remove();
            }
        };

        window.selectSubscription = function() {
            console.log('selectSubscription called!');
            window.tg.sendData('open_subscription');
            window.tg.close();
        };

        window.buyStars = function() {
            console.log('buyStars called!');
            // Удаляем предыдущее модальное окно
            document.querySelectorAll('.modal').forEach(m => m.remove());
            
            // Создаем окно с пакетами звёзд
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.id = 'starsModal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 style="text-align: center; margin-bottom: 20px;">💰 Докупить звёзды</h3>
                    
                    <div class="stars-package" onclick="window.buyStarsPackage('100k', 149)">
                        <div class="package-stars">1,000 ⭐</div>
                        <div class="package-price">149 ₽</div>
                    </div>
                    
                    <div class="stars-package" onclick="window.buyStarsPackage('200k', 249)">
                        <div class="package-stars">2,000 ⭐</div>
                        <div class="package-price">249 ₽</div>
                    </div>
                    
                    <div class="stars-package popular" onclick="window.buyStarsPackage('800k', 700)">
                        <div class="package-badge">🔥 ВЫГОДНО</div>
                        <div class="package-stars">8,000 ⭐</div>
                        <div class="package-price">700 ₽</div>
                    </div>
                    
                    <button class="btn btn-secondary" onclick="window.closeStarsModal()" style="margin-top: 16px;">
                        ← Назад
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.closeStarsModal = function() {
            console.log('closeStarsModal called!');
            const modal = document.getElementById('starsModal');
            if (modal) {
                modal.remove();
            }
        };

        window.buyStarsPackage = function(stars, price) {
            console.log('buyStarsPackage called:', stars, price);
            window.tg.sendData(JSON.stringify({action: 'buy_stars', stars: stars, price: price}));
            window.tg.showAlert('⭐ Переход к оплате ' + stars + ' за ' + price + '₽');
            setTimeout(() => window.tg.close(), 1000);
        };

        function copyRefLink() {
            const link = document.getElementById('refLink').value;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(link).then(function() {
                    showNotification('✅ Ссылка скопирована!');
                }).catch(function() {
                    fallbackCopy(link);
                });
            } else {
                fallbackCopy(link);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showNotification('✅ Ссылка скопирована!');
            } catch (err) {
                showNotification('❌ Скопируйте вручную');
            }
            document.body.removeChild(textarea);
        }

        function showNotification(text) {
            const notif = document.createElement('div');
            notif.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#7c3aed;color:white;padding:12px 24px;border-radius:10px;z-index:9999;';
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        // Загружаем данные при старте
        loadUserData().then(() => {
            // Обновляем реферальную ссылку с реальным user_id
            if (userId) {
                document.getElementById('refLink').value = `https://t.me/iisoul_bot?start=ref_${userId}`;
            }
        });
    </script>
</body>
</html>
