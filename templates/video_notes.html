<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soul Bot - Мои конспекты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #111827 0%, #2563eb 100%);
      min-height: 100vh;
      padding: 18px;
    }
    .container { max-width: 760px; margin: 0 auto; }
    .header {
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom: 12px;
    }
    .title { font-size: 20px; font-weight: 900; }
    .search {
      width: 100%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 12px;
      padding: 10px 12px;
      color:#fff;
      outline:none;
    }
    .card {
      background:#fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    .note {
      padding: 14px;
      border: 2px solid #e9ecef;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .note:hover { border-color:#2563eb; background:#f3f7ff; }
    .note-title { font-weight: 900; color:#111827; margin-bottom: 6px; }
    .note-meta { font-size: 12px; color:#6b7280; margin-bottom: 6px; }
    .note-preview { font-size: 13px; color:#374151; line-height:1.35; }
    .empty { color:#6b7280; text-align:center; padding: 22px 0; }
    .detail { display:none; }
    .detail-title { font-weight: 900; font-size: 18px; color:#111827; margin-bottom: 6px; }
    .detail-meta { font-size: 12px; color:#6b7280; margin-bottom: 10px; }
    .detail-text {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.4;
      color:#111827;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fafafa;
    }
    .btnrow { display:flex; gap:10px; margin-top: 12px; flex-wrap:wrap; }
    .btn {
      flex:1;
      padding: 12px;
      border-radius: 12px;
      border:none;
      font-weight: 900;
      cursor:pointer;
    }
    .btn-secondary { background:#e5e7eb; color:#111827; }
    .btn-danger { background:#ef4444; color:#fff; }
    .btn-primary { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color:#fff; }
    .toast {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #dcfce7;
      color:#14532d;
      display:none;
      font-weight:700;
      text-align:center;
    }
    .toast.show { display:block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">📂 Мои конспекты</div>
    </div>
    <input class="search" id="search" placeholder="🔍 Поиск по заголовку и тексту..." />

    <div class="card" style="margin-top:12px;">
      <div id="list">
        <div class="empty">Загрузка...</div>
      </div>

      <div class="detail" id="detail">
        <div class="detail-title" id="d-title"></div>
        <div class="detail-meta" id="d-meta"></div>
        <div class="detail-text" id="d-text"></div>
        <div class="btnrow">
          <button class="btn btn-secondary" onclick="backToList()">← Назад</button>
          <button class="btn btn-danger" onclick="deleteNote()">🗑 Удалить</button>
          <button class="btn btn-primary" onclick="shareNote()">📤 Поделиться</button>
        </div>
        <div class="toast" id="toast">Скопировано</div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    function parseUserId() {
      let userId = tg.initDataUnsafe?.user?.id;
      if (!userId && tg.initData) {
        try {
          const params = new URLSearchParams(tg.initData);
          const userStr = params.get('user');
          if (userStr) userId = JSON.parse(userStr).id;
        } catch (e) {}
      }
      if (!userId) userId = new URLSearchParams(window.location.search).get('user_id');
      return userId ? parseInt(userId, 10) : null;
    }
    const userId = parseUserId();

    let notes = [];
    let current = null;

    function esc(s){ return (s||'').toString(); }
    function formatDate(iso){
      try{
        const d = new Date(iso);
        return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'short', year:'numeric' });
      }catch(e){ return iso || ''; }
    }

    async function loadNotes() {
      if (!userId) {
        document.getElementById('list').innerHTML = '<div class="empty">Нет user_id</div>';
        return;
      }
      const resp = await fetch(`/api/video-notes/list/${userId}`);
      if (!resp.ok) {
        document.getElementById('list').innerHTML = '<div class="empty">Ошибка загрузки</div>';
        return;
      }
      const data = await resp.json();
      notes = data.notes || [];
      renderList();
    }

    function renderList() {
      document.getElementById('detail').style.display = 'none';
      const q = (document.getElementById('search').value || '').trim().toLowerCase();
      const filtered = q ? notes.filter(n =>
        (n.title||'').toLowerCase().includes(q) ||
        (n.text||'').toLowerCase().includes(q) ||
        (n.url||'').toLowerCase().includes(q)
      ) : notes;

      if (!filtered.length) {
        document.getElementById('list').innerHTML = '<div class="empty">Пока нет конспектов</div>';
        return;
      }
      const html = filtered.map(n => `
        <div class="note" onclick="openNote(${n.id})">
          <div class="note-title">🎬 ${esc(n.title)}</div>
          <div class="note-meta">📅 ${esc(n.date_label)} • ${esc(n.source)}</div>
          <div class="note-preview">📝 ${esc(n.preview)}</div>
        </div>
      `).join('');
      document.getElementById('list').innerHTML = html;
    }

    async function openNote(id) {
      const resp = await fetch(`/api/video-notes/get/${userId}/${id}`);
      if (!resp.ok) return;
      const data = await resp.json();
      current = data.note;
      document.getElementById('list').innerHTML = '';
      document.getElementById('detail').style.display = 'block';
      document.getElementById('d-title').textContent = `🎬 ${current.title}`;
      document.getElementById('d-meta').textContent = `🔗 ${current.url}\n📅 ${current.date_label}`;
      document.getElementById('d-text').textContent = current.text;
    }

    function backToList() {
      current = null;
      renderList();
    }

    async function deleteNote() {
      if (!current) return;
      const resp = await fetch('/api/video-notes/delete', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ user_id: userId, note_id: current.id })
      });
      if (!resp.ok) return;
      notes = notes.filter(n => n.id !== current.id);
      backToList();
    }

    function toast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 1800);
    }

    async function shareNote() {
      if (!current) return;
      const text = `${current.title}\n${current.url}\n\n${current.text}`;
      try {
        await navigator.clipboard.writeText(text);
        toast('✅ Скопировано');
      } catch (e) {
        toast('⚠️ Не удалось скопировать');
      }
      // optional: send to bot to share in chat
      try {
        tg.sendData(JSON.stringify({ type:'video_notes_share', note_id: current.id }));
      } catch (e) {}
    }

    document.getElementById('search').addEventListener('input', renderList);
    loadNotes();
  </script>
</body>
</html>
