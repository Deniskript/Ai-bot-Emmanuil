<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌙 Лунный календарь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #e8f0ff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 520px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 26px; margin-bottom: 6px; }
        .header p { font-size: 14px; color: #aabbd4; }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
        .card-title { font-weight: 600; margin-bottom: 12px; }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #4c7bff, #3dd1c7);
            margin-bottom: 8px;
            transition: opacity 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active {
            transform: scale(0.98);
            background: linear-gradient(135deg, #4caf50, #8bc34a) !important;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.45);
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            font-size: 15px;
            padding: 14px;
        }
        .btn-primary.loading { animation: pulse 1.5s ease-in-out infinite; }
        .btn.loading {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .btn.selected {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            box-shadow: 0 4px 16px rgba(76, 175, 80, 0.6);
            transform: translateY(-2px);
            position: relative;
        }
        .btn.selected::after {
            content: '✅';
            position: absolute;
            right: 12px;
            font-size: 16px;
        }
        .btn-back {
            position: sticky !important;
            bottom: 10px;
            z-index: 999;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.85) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .result { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
        .placeholder {
            text-align: center;
            padding: 20px;
            color: #a7a7c6;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
        }
        th, td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px;
            text-align: center;
        }
        th {
            background: rgba(255,255,255,0.08);
        }
        .phase {
            display: block;
            font-size: 10px;
            color: #a7c6ff;
        }
        
        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { background: linear-gradient(135deg, #4caf50, #66bb6a); }
        .toast.error { background: linear-gradient(135deg, #f44336, #e57373); }
        
        /* Onboarding */
        .onboarding {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 12px;
            color: #f6f2ff;
        }
        .onboarding strong { color: #ffffff; }
        
        /* Processing Animation */
        .processing-animation {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s;
        }
        .pulse-circle {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            animation: pulse-glow 1.5s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; box-shadow: 0 0 30px rgba(76, 175, 80, 0.8); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .processing-animation p {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .processing-animation .sub {
            font-size: 13px;
            color: #b9b9d9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌙 Лунный календарь</h1>
            <p>Фаза луны и рекомендации на день</p>
        </div>

        <div class="onboarding">
            <strong>Подсказка:</strong> выберите рекомендацию на сегодня или календарь на месяц.
        </div>

        <div class="card">
            <div class="card-title">🌑 Сегодня</div>
            <button class="btn btn-primary js-moon" onclick="loadToday(event)">Показать рекомендации на сегодня</button>
        </div>

        <div class="card">
            <div class="card-title">📅 Календарь на месяц</div>
            <button class="btn js-moon" onclick="loadMonth(event)">Показать лунный календарь</button>
        </div>

        <div class="card">
            <div class="card-title">✨ Результат</div>
            <div class="result" id="result">
                <div class="placeholder">🌙 Нажмите кнопку для получения лунных советов</div>
            </div>
            <div id="moon-table"></div>
        </div>

        <button class="btn btn-secondary btn-back" onclick="Telegram.WebApp.close()">← Вернуться в бот</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(value) {
            return (value || '').replace(/[&<>"']/g, (match) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[match]));
        }

        function formatText(text) {
            const escaped = escapeHtml(text);
            const bullets = escaped.replace(/^\*\s+/gm, '• ');
            const headings = bullets.replace(/^#{1,6}\s*(.+)$/gm, '<strong>$1</strong>');
            const bolded = headings.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            const italic = bolded.replace(/\*(.+?)\*/g, '<em>$1</em>');
            const paragraphs = italic.split(/\n\n+/).map(p => p.replace(/\n/g, '<br>'));
            return paragraphs.map(p => `<p>${p}</p>`).join('');
        }

        function setResult(text) {
            const resultEl = document.getElementById('result');
            if (text) {
                resultEl.innerHTML = formatText(text);
            } else {
                resultEl.innerHTML = '<div class="placeholder">Нет данных</div>';
            }
        }

        function showProcessing(message = 'Загружаю календарь...') {
            const resultEl = document.getElementById('result');
            resultEl.innerHTML = `
                <div class="processing-animation">
                    <div class="pulse-circle"></div>
                    <p>🔮 ${message}</p>
                    <p class="sub">✨ Подождите пожалуйста</p>
                </div>
            `;
            setTimeout(() => {
                resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function generateMoonTableHTML(grid) {
            if (!grid || !Array.isArray(grid) || grid.length === 0) {
                return '<div class="placeholder">Нет данных календаря</div>';
            }
            
            let html = '<table style="width:100%; border-collapse:collapse; text-align:center;">';
            html += '<thead><tr><th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Вс</th></tr></thead><tbody>';
            
            grid.forEach(week => {
                html += '<tr>';
                if (Array.isArray(week)) {
                    week.forEach(day => {
                        if (day && day.day) {
                            const phase = day.phase || '';
                            html += `<td style="padding:8px; border:1px solid rgba(255,255,255,0.1);">${day.day}<br><small style="font-size:10px;">${phase}</small></td>`;
                        } else {
                            html += '<td style="padding:8px; border:1px solid rgba(255,255,255,0.1);"></td>';
                        }
                    });
                }
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            return html;
        }

        function setButtonLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.classList.add('loading');
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = '<span class="spinner"></span> Загрузка...';
            } else {
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.innerHTML = btn.dataset.originalText;
            }
        }

        function setActiveButton(btn, selector) {
            document.querySelectorAll(selector).forEach(el => el.classList.remove('selected'));
            btn.classList.add('selected');
        }

        async function loadToday(event) {
            const btn = event.target;
            setActiveButton(btn, '.js-moon');
            setButtonLoading(btn, true);
            
            try {
                const res = await fetch('/magic/moon/today');
                const data = await res.json();
                
                if (data.success) {
                    setResult(data.text);
                    document.getElementById('moon-table').innerHTML = '';
                    showToast('✅ Данные получены', 'success');
                } else {
                    showToast(`❌ Ошибка: ${data.error || 'не удалось загрузить'}`, 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка сети', 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function loadMonth(event) {
            const btn = event.target;
            setActiveButton(btn, '.js-moon');
            setButtonLoading(btn, true);
            showProcessing('Загружаю календарь...');
            
            try {
                const res = await fetch('/magic/moon/month');
                const data = await res.json();
                
                if (data.success) {
                    setResult(data.text || 'Лунный календарь на текущий месяц:');
                    const tableDiv = document.getElementById('moon-table');
                    if (data.grid) {
                        tableDiv.innerHTML = generateMoonTableHTML(data.grid);
                    }
                    showToast('✅ Календарь загружен', 'success');
                } else {
                    showToast(`❌ Ошибка: ${data.error || 'не удалось загрузить'}`, 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка сети', 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        }
    </script>
</body>
</html>
